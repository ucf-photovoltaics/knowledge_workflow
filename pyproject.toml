[project]
name = "kweave"
version = "0.1.0"
description = "Zotero-to-knowledge-graph agent pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
scispacy = [
  "scispacy==0.5.4",
  "spacy>=3.7,<3.8",
  "en-core-sci-md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_md-0.5.4.tar.gz",
]
mcp = ["fastmcp>=3.2,<4"]

[project.scripts]
kweave = "kweave.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kweave"]

[tool.hatch.metadata]
allow-direct-references = true
