[project]
name = "knowledge-workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.49.0",
    "fitz>=0.0.1.dev2",
    "frontend>=0.0.3",
    "keybert>=0.9.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pypdf>=6.7.5",
    "python-dotenv>=1.2.2",
    "pyzotero>=1.10.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "spacy>=3.8.11",
    "instructor>=1.3.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.36",
    "openai>=1.0.0",
    "shiny>=1.0.0",
    "spyder-kernels==3.1",
    "fastmcp>=3.2.4",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "networkx>=3.0",
    "pyvis>=0.3.2",
    "plotly>=6.8.0",
    "shinywidgets>=0.8.1",
]

# Pull torch from the CUDA 12.8 wheel index (sm_120 kernels for RTX 50-series /
# Blackwell). Without this, `uv sync` installs the CPU-only torch from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
